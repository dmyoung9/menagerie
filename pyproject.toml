[project]
name = "menagerie"
version = "2.0.0"
description = "Single-host inference control plane"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "psutil>=6", "huggingface-hub>=0.28"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=/tmp/opencode/menagerie-pytest"
