[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "menagerie"
version = "2.1.4"
description = "Single-host inference control plane"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "psutil>=6", "huggingface-hub>=0.28", "tqdm>=4.66"]
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }

[project.scripts]
menagerie = "controlplane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["controlplane"]

[tool.hatch.build.targets.sdist]
include = ["controlplane/", "frontend/src/", "frontend/public/", "frontend/index.html", "frontend/package.json", "frontend/package-lock.json", "frontend/tsconfig.json", "frontend/tsconfig.tests.json", "frontend/eslint.config.js", "frontend/vite.config.ts", "frontend/components.json", "frontend/preset.json", "frontend/playwright.config.ts", "frontend/tests/", "plugins/opencode/*.ts", "plugins/opencode/*.json", "plugins/opencode/eslint.config.js", ".prettierrc.json", ".prettierignore", ".dockerignore", ".github/workflows/", "deploy/", "scripts/", "install.sh", "hatch_build.py", "README.md", "LICENSE", "uv.lock", "SECURITY.md", "AGENTS.md", "docs/", "tests/", "smoke_*.js", "menagerie.service"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.14"]
windows-build = [
    "pyinstaller==6.16.0",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
