name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - run: npm run check && npm run lint && npm run format:check
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-checks
          path: frontend/test-results/
          retention-days: 7
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest -q
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugins/opencode
      - run: npm run check && npm test
        working-directory: plugins/opencode
      - run: npm run lint && npm run format:check
        working-directory: plugins/opencode
      - run: uv build
      - name: Prepare version-aligned release inputs
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run --no-sync python -m scripts.prepare_release --tag "$GITHUB_REF_NAME"
          else
            uv run --no-sync python -m scripts.prepare_release
          fi
      - run: uv run --no-sync python -m scripts.check_distribution dist/*.whl dist/*.tar.gz
      - run: npm test
        working-directory: frontend
      - run: uv venv /tmp/menagerie-wheel-check
      - run: uv pip install --python /tmp/menagerie-wheel-check/bin/python --constraint dist/menagerie-*-requirements.txt dist/*.whl
      - run: /tmp/menagerie-wheel-check/bin/python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: menagerie-python-${{ matrix.python }}
          path: dist/*
  container:
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: menagerie-python-3.12
          path: dist
      - uses: docker/setup-buildx-action@v3
      - name: Build container from inspected artifacts
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          docker build --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" -f deploy/Dockerfile -t menagerie-check .
      - run: python -m scripts.check_container menagerie-check --user 99:100
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-install-project --group windows-build
      - name: Native host and fake-subprocess checks
        run: uv run --no-sync python -m pytest -q tests/test_host.py tests/test_windows_engines.py tests/test_windows_launcher.py
      - run: uv build
      - name: Inspect wheel and corresponding source
        shell: pwsh
        run: |
          $archives = Get-ChildItem dist -Include *.whl,*.tar.gz -Recurse | ForEach-Object FullName
          uv run --no-sync python -m scripts.check_distribution @archives
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package reviewed installed wheel outside checkout
        shell: pwsh
        run: |
          uv venv "$env:RUNNER_TEMP/menagerie-package"
          $python = "$env:RUNNER_TEMP/menagerie-package/Scripts/python.exe"
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv export --locked --no-dev --group windows-build --no-emit-project --no-hashes --output-file build-requirements.txt
          uv pip install --python $python --constraint build-requirements.txt $wheel "pyinstaller==6.16.0"
          & $python scripts/build_windows.py --baseline-for-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m PyInstaller --noconfirm --clean --onefile --name fixture-worker --distpath build/windows/fixtures --workpath build/windows/fixture-work --specpath build/windows tests/fake_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect frozen payload
        run: uv run --no-sync python -m scripts.check_windows_distribution build/windows/payload/Menagerie
      - name: Installed application acceptance with fake worker
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/windows/*-setup.exe).FullName
          uv run --no-sync python -m scripts.check_windows --installer $installer --baseline build/windows/baseline/menagerie-0.0.0-windows-x64-setup.exe --worker build/windows/fixtures/fixture-worker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: menagerie-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
